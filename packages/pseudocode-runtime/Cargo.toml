[package]
name = "pseudocode-runtime"
version = "0.1.0"
edition = "2021"
description = "Rust WASM runtime for Pseudo Build pseudocode AST execution."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1"

